# Baut die App bei jedem Hochladen auf main und legt die fertige Seite ab:
#   1. in den Ordner docs/ auf main  → funktioniert mit „Deploy from a branch: main / (root)“
#      (index.html leitet auf GitHub Pages nach docs/ weiter) und mit „main / docs“
#   2. in den Branch gh-pages         → funktioniert mit „Deploy from a branch: gh-pages / (root)“
name: Webseite bauen

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --outDir docs --emptyOutDir
      - run: touch docs/.nojekyll

      - name: Fertige Seite nach docs/ auf main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "docs/ unverändert"
          else
            git commit -q -m "Seite gebaut aus ${GITHUB_SHA::7} [skip ci]"
            git push
          fi

      - name: Fertige Seite in den Branch gh-pages
        working-directory: docs
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Seite gebaut aus ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
